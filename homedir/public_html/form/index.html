<!DOCTYPE HTML>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="https://www.sedir.org.pe/form/estilos.css" />
</head>
<body>
    <form method="post" class="contacto" id="contacto">
        <fieldset>
            <div><label class="notitex">Nombre:</label><input type="text" class="nombre" name="nombre" placeholder="Tu nombre" required /></div>
            <div><label class="notitex">Email:</label><input type="text" class="email" name="email" placeholder="Email" required /></div>
            <div><label class="notitex">Telefono:</label><input type="text" class="telefono" name="email" placeholder="Tel&eacute;fono" required /></div>
            <div><label class="notitex">Mensaje:</label><textarea cols="30" rows="5" class="mensaje" name="mensaje" placeholder="Mensaje" required></textarea></div>
            <div class="ultimo">
                <img src="https:/sedir.org.pe/form/ajax.gif" class="ajaxgif hide" />
                <div class="msg"></div>
                <button class="boton_envio">Enviar Mensaje</button>
            </div>
        </fieldset>
     </form>
<script type="text/javascript" src="https://code.jquery.com/jquery-latest.min.js"></script>
<script type="text/javascript" src="https://sedir.org.pe/form/funciones.js"></script>
</body>
</html>
